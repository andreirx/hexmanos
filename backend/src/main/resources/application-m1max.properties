# Database Configuration (Assuming local on M1 Max or RDS, configure via ENV vars)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate

# Storage Strategy (AWS S3)
app.storage.type=s3
app.storage.aws.bucket=hexmanos-assets-prod
app.storage.aws.prefix=live
aws.region=eu-central-1
